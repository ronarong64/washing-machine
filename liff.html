<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังบันทึกคิวซักผ้า...</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #fafafa; 
      color: #333333;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1DB446; 
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 { font-weight: 500; font-size: 1.3rem; margin: 0; }
    p { font-weight: 300; font-size: 0.95rem; color: #888888; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="app-header" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
  <img src="https://raw.githubusercontent.com/ronarong64/washing-machine/refs/heads/main/LINE%20Icon.png" 
       alt="Logo" style="width: 30px; height: 30px; border-radius: 50%;">
  <h1 style="margin: 0;">ร้านสะดวกซัก</h1>
</div>

<script>
  // ฟังก์ชันสร้าง QR Code โดยดึงจาก API slip2go
  async function generateQR() {
    const btn = document.getElementById('btn-generate');
    const machineId = new URLSearchParams(window.location.search).get('machine');
    
    btn.innerText = "กำลังสร้าง QR...";
    btn.disabled = true;

    // ส่งค่าไปให้ Google Apps Script (GAS) เพื่อเรียกใช้ slip2go API
    google.script.run
      .withSuccessHandler(function(qrUrl) {
        document.getElementById('qr-image').src = qrUrl;
        document.getElementById('qr-section').style.display = 'block';
        btn.innerText = "รอการชำระเงิน...";
      })
      .withFailureHandler(function(err) {
        alert("เกิดข้อผิดพลาด: " + err);
        btn.disabled = false;
        btn.innerText = "ลองใหม่อีกครั้ง";
      })
      .createSlip2GoQR(machineId); // ฟังก์ชันนี้ต้องไปสร้างไว้ในไฟล์ .gs
  }
</script>
</body>
</html>
