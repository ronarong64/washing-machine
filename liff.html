<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แจ้งชำระเงิน</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    .card { width: 100%; max-width: 350px; text-align: center; }
    #file-input { margin: 20px 0; }
  </style>
</head>
<body>
  <h2>อัปโหลดสลิปโอนเงิน</h2>
  <div class="card">
    <input type="file" id="file-input" accept="image/*">
    <button onclick="uploadSlip()">ยืนยันการชำระเงิน</button>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    async function uploadSlip() {
      const file = document.getElementById('file-input').files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        google.script.run
          .withSuccessHandler(() => alert("ตรวจสอบสลิปเรียบร้อย!"))
          .processSlip(e.target.result, new URLSearchParams(window.location.search).get('machine'));
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
