<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>อัปโหลดสลิปชำระเงิน</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #fafafa; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .card { background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 360px; text-align: center; box-sizing: border-box; }
    h2 { font-weight: 500; margin-bottom: 5px; color: #333; }
    p { color: #666; font-size: 0.95rem; margin-top: 0; margin-bottom: 20px; }
    .btn-primary { background-color: #06C755; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-size: 16px; font-weight: 500; margin-top: 20px; cursor: pointer; transition: 0.2s; }
    .btn-primary:disabled { background-color: #ccc; cursor: not-allowed; }
    #preview { max-width: 100%; max-height: 250px; border-radius: 10px; margin-top: 15px; display: none; margin-left: auto; margin-right: auto; border: 1px dashed #ddd; }
    .file-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; margin-top: 10px; }
    .btn-upload { background-color: #f8f9fa; color: #495057; border: 2px dashed #ced4da; padding: 25px 15px; border-radius: 10px; width: 100%; box-sizing: border-box; display: block; font-weight: 500; cursor: pointer; }
    .file-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
    #status-msg { margin-top: 15px; font-size: 0.95rem; font-weight: 500; line-height: 1.4; }
    .spinner { display: none; width: 24px; height: 24px; border: 3px solid #f3f3f3; border-top: 3px solid #06C755; border-radius: 50%; animation: spin 1s linear infinite; margin: 15px auto 0 auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="card">
    <h2 id="machine-title">ตรวจสอบข้อมูลตู้...</h2>
    <p id="machine-price">กำลังเรียกข้อมูลราคาสินค้า...</p>
    
    <div class="file-wrapper">
      <span class="btn-upload" id="upload-label">📸 กดที่นี่เพื่อเลือกรูปภาพสลิป</span>
      <input type="file" id="slip-file" accept="image/jpeg, image/png">
    </div>

    <img id="preview" alt="สลิปของคุณ">
    <div class="spinner" id="loading-spinner"></div>
    <p id="status-msg"></p>
    
    <button class="btn-primary" id="btn-submit" onclick="submitSlip()" disabled>ตรวจสอบสลิปเงินโอน</button>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const machineId = urlParams.get('machine');
    let base64ImageString = null;

    // 🔗 ตั้งราคาอ้างอิงให้ล้อกับในตัวแปรสคริปต์หลังบ้าน
    const prices = { "1": 30, "2": 40, "3": 50 };

    window.onload = function() {
      if (!machineId || !prices[machineId]) {
        document.getElementById('machine-title').innerText = "❌ ไม่พบหมายเลขเครื่อง";
        document.getElementById('machine-price').innerText = "กรุณาสแกนคิวอาร์โค้ดที่ติดอยู่หน้าเครื่องซักผ้าใหม่อีกครั้ง";
        document.getElementById('slip-file').disabled = true;
        document.getElementById('upload-label').style.opacity = "0.5";
      } else {
        var name = machineId === "3" ? "เครื่องอบแห้ง" : "เครื่องซักผ้า " + machineId;
        document.getElementById('machine-title').innerText = "ตู้บริการ: " + name;
        document.getElementById('machine-price').innerText = "ยอดเงินโอนขั้นต่ำ: " + prices[machineId] + " บาท";
      }
    };

    // เมื่อผู้ใช้เลือกไฟล์รูปภาพสลิป
    document.getElementById('slip-file').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('upload-label').innerText = "🔄 เปลี่ยนรูปภาพสลิป";
      
      const reader = new FileReader();
      reader.onload = function(event) {
        const preview = document.getElementById('preview');
        preview.src = event.target.result;
        preview.style.display = 'block';
        base64ImageString = event.target.result; // เก็บ Base64 ไว้ส่งหลังบ้าน
        document.getElementById('btn-submit').disabled = false;
        document.getElementById('status-msg').innerText = "";
      };
      reader.readAsDataURL(file);
    });

    // ส่งไฟล์ภาพสลิปไปตรวจสอบที่ Google Apps Script
    function submitSlip() {
      if (!base64ImageString || !machineId) return;
      
      const btn = document.getElementById('btn-submit');
      const msg = document.getElementById('status-msg');
      const spinner = document.getElementById('loading-spinner');
      
      btn.disabled = true;
      btn.innerText = "กำลังประมวลผล...";
      msg.style.color = "#666";
      msg.innerText = "ระบบกำลังอัปโหลดและส่งภาพสลิปให้ slip2go ตรวจสอบความถูกต้องจากธนาคาร...";
      spinner.style.display = "block";

      // เรียกฟังก์ชัน processSlip ในไฟล์สคริปต์ .gs ของเรา
      google.script.run
        .withSuccessHandler(function(response) {
          spinner.style.display = "none";
          if (response.success) {
            msg.style.color = "#06C755";
            msg.innerText = "✅ " + response.message;
            btn.style.display = "none";
            // หากสำเร็จสามารถตั้งให้ปิดหน้าจอ LINE อัตโนมัติหลังจากผ่านไป 3 วินาทีได้
            setTimeout(function() { liff.closeWindow(); }, 3500);
          } else {
            msg.style.color = "#FF334B";
            msg.innerText = "❌ " + response.message;
            btn.innerText = "ลองอัปโหลดใหม่อีกครั้ง";
            btn.disabled = false;
          }
        })
        .withFailureHandler(function(error) {
          spinner.style.display = "none";
          msg.style.color = "#FF334B";
          msg.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อระบบ: " + error;
          btn.innerText = "พยายามใหม่อีกครั้ง";
          btn.disabled = false;
        })
        .processSlip(base64ImageString, machineId);
    }
  </script>
</body>
</html>
