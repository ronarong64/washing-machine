<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Kanit', sans-serif;
        background-color: #fafafa;
        color: #262626;
        padding: 15px;
        margin: 0;
        font-size: 16px;
      }
      .header {
        text-align: center;
        margin-bottom: 25px;
        margin-top: 10px;
      }
      .header h2 {
        margin: 0;
        font-weight: 500;
        color: #000;
        font-size: 1.8em;
      }
      .header p {
        color: #8e8e8e;
        font-size: 1.1em;
        margin-top: 5px;
      }
      .card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        border: 1px solid #dbdbdb;
      }
      .month-title {
        font-size: 1.3em;
        font-weight: 500;
        border-bottom: 1px solid #efefef;
        padding-bottom: 10px;
        margin-bottom: 15px;
        color: #1DB446;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 1.15em;
      }
      .total {
        font-weight: 500;
        color: #0095f6;
        font-size: 1.4em;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px dashed #efefef;
      }
      .loading {
        text-align: center;
        color: #8e8e8e;
        font-size: 1.2em;
        margin-top: 40px;
      }
      /* 🌟 ส่วนตกแต่งกล่องรายชื่อลูกค้าสแกนจ่าย */
      .details-box {
        background-color: #f0fdf4; /* สีพื้นหลังเขียวอ่อนๆ */
        border: 1px solid #bbf7d0;
        border-radius: 8px;
        padding: 10px 15px;
        margin-bottom: 15px;
        font-size: 0.95em;
      }
      .details-title {
        font-weight: 500;
        color: #166534;
        margin-bottom: 8px;
        font-size: 0.9em;
      }
      .detail-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 4px;
        color: #374151;
        border-bottom: 1px dashed #dcfce7;
        padding-bottom: 4px;
      }
      .detail-item:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }
    </style>
  </head>
  <body>
    
    <div class="header">
      <h2>📊 รายงานรายรับ</h2>
      <p>เฉพาะเจ้าของร้าน</p>
    </div>

    <div id="report-container">
      <div class="loading">กำลังดึงข้อมูล... ⏳</div>
    </div>

    <script>
      // ⚠️ นำ Web App URL ของคุณมาใส่ตรงนี้
      const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxy1MVAsyOuQWE_379RzyOGacWOeEgAHGJHfylIyZeI_A0jkiBEsYFImuz5_peKz-mo9g/exec';

      fetch(GAS_WEB_APP_URL + '?action=getReport')
        .then(response => response.json())
        .then(data => {
          showReport(data);
        })
        .catch(error => {
          console.error('Error:', error);
          document.getElementById('report-container').innerHTML = '<div class="loading" style="color:#FF334B;">❌ เกิดข้อผิดพลาดในการดึงข้อมูล</div>';
        });

      function showReport(data) {
        var container = document.getElementById('report-container');
        container.innerHTML = '';

        if(Object.keys(data).length === 0) {
          container.innerHTML = '<div class="loading">ยังไม่มีข้อมูลรายรับ</div>';
          return;
        }

        for (var month in data) {
          var monthData = data[month];
          
          // 🌟 สร้าง HTML สำหรับแสดงรายชื่อคนโอน
          var transferDetailsHTML = '';
          if (monthData.transferList && monthData.transferList.length > 0) {
            transferDetailsHTML = `
              <div class="details-box">
                <div class="details-title">📋 รายชื่อลูกค้าที่สแกนจ่าย:</div>
            `;
            monthData.transferList.forEach(function(item) {
              transferDetailsHTML += `
                <div class="detail-item">
                  <span>👤 ${item.name}</span>
                  <span>฿${item.amount}</span>
                </div>
              `;
            });
            transferDetailsHTML += `</div>`;
          }

          var card = document.createElement('div');
          card.className = 'card';
          
          card.innerHTML = `
            <div class="month-title">📅 ${month}</div>
            <div class="stat-row">
              <span>📱 สแกนจ่าย (รวม)</span>
              <span>฿${monthData.transfer}</span>
            </div>
            ${transferDetailsHTML} <div class="stat-row">
              <span>🪙 หยอดเหรียญ</span>
              <span>฿${monthData.coin}</span>
            </div>
            <div class="stat-row total">
              <span>รวมทั้งหมด</span>
              <span>฿${monthData.total}</span>
            </div>
          `;
          container.appendChild(card);
        }
      }
    </script>
  </body>
</html>
