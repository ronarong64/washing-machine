<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังบันทึกคิวซักผ้า...</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Kanit', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #fafafa; /* พื้นหลังสีสว่างสบายตา */
      color: #333333;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #1DB446; /* สีเขียวหลักของ LINE */
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 { font-weight: 500; font-size: 1.3rem; margin: 0; }
    p { font-weight: 300; font-size: 0.95rem; color: #888888; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="spinner"></div>
  <h2 id="status-title">กำลังดำเนินการ...</h2>
  <p id="status-desc">กรุณารอสักครู่ ระบบกำลังส่งคำสั่งเข้าแชท</p>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <script>
    // ใส่ LIFF ID ที่สร้างไว้
    const myLiffId = "2010363734-hFDjDcdH";

    async function initializeLiff() {
      try {
        await liff.init({ liffId: myLiffId });

        // ตรวจสอบว่าผู้ใช้ล็อกอินหรือยัง (กรณีเปิดจากแอปอื่นที่ไม่ใช่ LINE)
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // ดึงหมายเลขเครื่องจาก URL Parameter
        const urlParams = new URLSearchParams(window.location.search);
        const machineNumber = urlParams.get('machine');

        if (machineNumber) {
          // สั่งให้ส่งข้อความเข้าแชทแทนผู้ใช้งาน
          await liff.sendMessages([
            {
              type: "text",
              text: "ซักผ้า เครื่องที่ " + machineNumber
            }
          ]);
          
          // ปิดหน้าต่าง LIFF ทันทีที่ส่งเสร็จ
          liff.closeWindow();

        } else {
          // กรณีไม่มี Parameter ส่งมา
          document.getElementById('status-title').innerText = "ไม่พบหมายเลขเครื่อง";
          document.getElementById('status-desc').innerText = "กรุณาสแกน QR Code ใหม่อีกครั้ง";
          document.querySelector('.spinner').style.display = 'none';
        }

      } catch (err) {
        console.error("LIFF Initialization failed", err);
        document.getElementById('status-title').innerText = "เกิดข้อผิดพลาด";
        document.getElementById('status-desc').innerText = "ไม่สามารถเชื่อมต่อระบบได้";
        document.querySelector('.spinner').style.display = 'none';
      }
    }

    // เริ่มทำงานเมื่อเปิดหน้าเว็บ
    initializeLiff();
  </script>
</body>
</html>
