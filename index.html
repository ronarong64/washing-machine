<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Kanit', sans-serif;
        background-color: #fafafa;
        color: #262626;
        padding: 15px;
        margin: 0;
        font-size: 16px;
      }
      .header {
        text-align: center;
        margin-bottom: 20px;
        margin-top: 10px;
      }
      .header h2 {
        margin: 0;
        font-weight: 500;
        color: #000;
        font-size: 1.8em;
      }
      .header p {
        color: #8e8e8e;
        font-size: 1.1em;
        margin-top: 5px;
      }
      
      /* 📅 ส่วนกล่องเลือกวัน/เดือนย้อนหลัง */
      .filter-container {
        background: white;
        border-radius: 12px;
        padding: 12px 15px;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        border: 1px solid #dbdbdb;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .filter-label {
        font-weight: 500;
        color: #262626;
        font-size: 1.05em;
      }
      .filter-select {
        font-family: 'Kanit', sans-serif;
        font-size: 1em;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid #dbdbdb;
        background-color: #fff;
        outline: none;
        color: #262626;
        cursor: pointer;
        min-width: 140px;
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        border: 1px solid #dbdbdb;
      }
      .month-title {
        font-size: 1.3em;
        font-weight: 500;
        border-bottom: 1px solid #efefef;
        padding-bottom: 10px;
        margin-bottom: 15px;
        color: #000;
      }
      .section-title {
        font-size: 0.9em;
        color: #8e8e8e;
        font-weight: 500;
        margin-top: 15px;
        margin-bottom: 8px;
        text-transform: uppercase;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 1.1em;
      }
      .stat-row span:last-child {
        font-weight: 500;
      }
      .divider {
        border-top: 1px dashed #efefef;
        margin: 15px 0;
      }
      .total {
        font-weight: 500;
        color: #0095f6; /* สีฟ้าสไตล์ Instagram */
        font-size: 1.4em;
        margin-top: 15px;
        padding-top: 10px;
        border-top: 1px solid #efefef;
      }
      .loading {
        text-align: center;
        color: #8e8e8e;
        font-size: 1.2em;
        margin-top: 40px;
      }
      /* ส่วนกล่องรายชื่อลูกค้าโอนเงิน */
      .details-box {
        background-color: #fcfcfc;
        border: 1px solid #eef0f2;
        border-radius: 8px;
        padding: 10px 15px;
        margin-top: 5px;
        font-size: 0.95em;
      }
      .detail-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        color: #4b5563;
      }
      .detail-item:last-child {
        margin-bottom: 0;
      }
      .machine-tag {
        font-size: 0.85em;
        color: #8e8e8e;
        background-color: #f3f4f6;
        padding: 1px 6px;
        border-radius: 4px;
        margin-left: 5px;
      }
    </style>
  </head>
  <body>
    
    <div class="header">
      <h2>📊 รายงานรายรับ</h2>
      <p>เฉพาะเจ้าของร้าน</p>
    </div>

    <div class="filter-container" id="filter-wrapper" style="display: none;">
      <span class="filter-label">📅 เลือกดูย้อนหลัง:</span>
      <select id="month-filter" class="filter-select">
        <option value="all">ทั้งหมดทุกเดือน</option>
      </select>
    </div>

    <div id="report-container">
      <div class="loading">กำลังดึงข้อมูล... ⏳</div>
    </div>

    <script>
      const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxy1MVAsyOuQWE_379RzyOGacWOeEgAHGJHfylIyZeI_A0jkiBEsYFImuz5_peKz-mo9g/exec';
      let globalData = {}; // เก็บข้อมูลทั้งหมดไว้คัดกรอง

      // ดึงข้อมูลจาก GAS ครั้งเดียว
      fetch(GAS_WEB_APP_URL + '?action=getReport')
        .then(response => response.json())
        .then(data => {
          globalData = data;
          setupFilter(data); // ตั้งค่าตัวเลือกเดือน
          renderReport('all'); // แสดงผลทั้งหมดเป็นค่าเริ่มต้น
        })
        .catch(error => {
          console.error('Error:', error);
          document.getElementById('report-container').innerHTML = '<div class="loading" style="color:#FF334B;">❌ เกิดข้อผิดพลาดในการดึงข้อมูล</div>';
        });

      // ⚙️ สร้างตัวเลือกเดือนย้อนหลังอัตโนมัติจากข้อมูลในระบบ
      function setupFilter(data) {
        const filterSelect = document.getElementById('month-filter');
        const filterWrapper = document.getElementById('filter-wrapper');
        
        if (Object.keys(data).length > 0) {
          filterWrapper.style.display = 'flex'; // แสดงกล่องเลือกเมื่อมีข้อมูล
          
          for (var month in data) {
            var option = document.createElement('option');
            option.value = month;
            option.textContent = month;
            filterSelect.appendChild(option);
          }
          
          // ดักจับเหตุการณ์เมื่อผู้ใช้เลือกเปลี่ยนเดือน
          filterSelect.addEventListener('change', function() {
            renderReport(this.value);
          });
        }
      }

      // 🖼️ ฟังก์ชันแสดงผลการรายงาน
      function renderReport(selectedMonth) {
        var container = document.getElementById('report-container');
        container.innerHTML = '';

        if(Object.keys(globalData).length === 0) {
          container.innerHTML = '<div class="loading">ยังไม่มีข้อมูลรายรับ</div>';
          return;
        }

        // วนลูปเพื่อแสดงข้อมูลตามเงื่อนไขที่เลือก
        for (var month in globalData) {
          // ถ้าเลือกเดือนเฉพาะ และเดือนในลูปไม่ตรง ให้ข้ามไป
          if (selectedMonth !== 'all' && selectedMonth !== month) {
            continue;
          }

          var monthData = globalData[month];

          // วนลูปสร้างรายชื่อลูกค้าสแกนจ่ายพร้อมบอกเครื่องที่ใช้
          var transferDetailsHTML = '';
          if (monthData.transferList && monthData.transferList.length > 0) {
            transferDetailsHTML = `<div class="details-box">`;
            monthData.transferList.forEach(function(item) {
              transferDetailsHTML += `
                <div class="detail-item">
                  <span>👤 ${item.name} <span class="machine-tag">${item.machine}</span></span>
                  <span>฿${Number(item.amount).toFixed(2)}</span>
                </div>
              `;
            });
            transferDetailsHTML += `</div>`;
          } else {
            transferDetailsHTML = `<div class="details-box" style="color:#8e8e8e; text-align:center;">ไม่มีประวัติการสแกนจ่ายในเดือนนี้</div>`;
          }

          var card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="month-title">📅 ${month}</div>
            
            <div class="section-title">แยกตามประเภทเครื่อง</div>
            <div class="stat-row">
              <span>🧺 ยอดรวมเครื่องซักผ้า</span>
              <span>฿${Number(monthData.washTotal).toFixed(2)}</span>
            </div>
            <div class="stat-row">
              <span>💨 ยอดรวมเครื่องอบแห้ง</span>
              <span>฿${Number(monthData.dryTotal).toFixed(2)}</span>
            </div>
            
            <div class="divider"></div>
            
            <div class="section-title">แยกตามช่องทางชำระเงิน</div>
            <div class="stat-row">
              <span>📱 สแกนจ่าย (LINE)</span>
              <span>฿${Number(monthData.transfer).toFixed(2)}</span>
            </div>
            
            ${transferDetailsHTML}
            
            <div class="stat-row" style="margin-top: 15px;">
              <span>🪙 หยอดเหรียญ</span>
              <span>฿${Number(monthData.coin).toFixed(2)}</span>
            </div>
            
            <div class="stat-row total">
              <span>รวมรายรับทั้งหมด</span>
              <span>฿${Number(monthData.total).toFixed(2)}</span>
            </div>
          `;
          container.appendChild(card);
        }
      }
    </script>
  </body>
</html>
